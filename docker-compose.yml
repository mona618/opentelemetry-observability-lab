services:
  otel-collector:
    image: otel/opentelemetry-collector:0.164.0
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "127.0.0.1:4317:4317"
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
      - ./evidence:/data
    restart: unless-stopped
