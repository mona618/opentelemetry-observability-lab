name: OpenTelemetry observability lab

on:
  push:
  workflow_dispatch:

jobs:
  collector-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install OpenTelemetry SDK
        run: python -m pip install -r requirements.txt
      - name: Test correlation guard
        run: python -m unittest -v test_verify_evidence.py
      - name: A-level console spans
        run: |
          set -o pipefail
          python basic_console.py | tee evidence/basic_console.txt
      - name: Match Collector UID to writable evidence directory
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Start Dockerized Collector
        run: |
          docker compose up -d
          sleep 2
          docker compose ps
          docker compose ps --status running --services | grep -x otel-collector
      - name: Send OTLP traces and logs
        run: |
          set -o pipefail
          python otel_app.py | tee evidence/app_output.txt
      - name: Verify both pipelines and correlation
        run: |
          set -o pipefail
          sleep 5
          python verify_evidence.py | tee evidence/verification.txt
      - name: Show Collector output
        if: always()
        run: |
          docker compose ps
          docker compose logs --tail=160 otel-collector | tee evidence/collector_console.log
          ls -lh evidence
      - name: Upload telemetry evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: otel-evidence
          path: |
            evidence/basic_console.txt
            evidence/app_output.txt
            evidence/verification.txt
            evidence/collector_console.log
            evidence/traces.json
            evidence/logs.json
          if-no-files-found: warn
      - name: Stop Collector
        if: always()
        run: docker compose down

